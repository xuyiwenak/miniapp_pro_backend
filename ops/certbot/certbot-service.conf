[Unit]
Wants=network-online.target
After=network-online.target docker.service
StartLimitIntervalSec=6h
StartLimitBurst=3

[Service]
Restart=on-failure
RestartSec=15min
TimeoutStartSec=45min
ExecStartPost=/usr/bin/python3 /root/workspace/miniapp_pro_backend/ops/certbot/manage.py sync
ExecStopPost=/usr/bin/python3 /root/workspace/miniapp_pro_backend/ops/certbot/manage.py audit

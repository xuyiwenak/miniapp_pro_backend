server {
    listen 80;
    server_name arttherapy.starryspark.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name arttherapy.starryspark.com.cn;
    client_max_body_size 10m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/nginx/ssl/starryspark/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/starryspark/privkey.pem;
    include /etc/nginx/includes/ssl-params.conf;

    root /usr/share/nginx/html/arttherapy;
    index index.html;

    location ~* \.(env|bak|old|save|log|pwd|sh|yml|yaml|xml|php|asp|aspx|jsp|cgi|cfg|ini|sql|db|sqlite)$ {
        return 444;
    }
    location ~* ^/(\.aws|\.git|\.env|\.svn|phpinfo|wp-|webdav|cgi-bin|debug|composer\.json|package\.json) {
        return 444;
    }

    location /api/ {
        set $backend "mandis_app:42002";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~* \.(?:js|css|avif|webp|png|jpg|jpeg|svg|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/arttherapy.ssl.access.log;
}

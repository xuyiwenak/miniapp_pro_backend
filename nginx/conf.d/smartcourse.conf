server {
    listen 80;
    server_name smart.starryspark.com.cn;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name smart.starryspark.com.cn;
    ssl_certificate /etc/letsencrypt/live/smart.starryspark.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smart.starryspark.com.cn/privkey.pem;
    include /etc/nginx/includes/ssl-params.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;
    root /usr/share/nginx/html;
    client_max_body_size 12m;

    location = / {
        return 302 /smartcourse/;
    }
    location = /smartcourse {
        return 301 /smartcourse/;
    }
    location ^~ /smartcourse-api/ {
        set $backend smartcourse_app:43002;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream off;
        proxy_buffering off;
    }
    location ^~ /smartcourse/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /smartcourse/favicon.svg {
        try_files $uri =404;
    }
    location /smartcourse/ {
        try_files $uri /smartcourse/index.html;
        add_header Cache-Control "no-cache";
    }
    location / {
        return 404;
    }
    access_log /var/log/nginx/smartcourse.access.log;
}

# Nginx 配置位于本目录 ./nginx/（与 monorepo 根目录 nginx/ 同步维护，修改后请两处对齐或从根目录 cp -r nginx art_backend/）。
# 在 ECS 上：仓库路径示例 /root/workspace/miniapp_pro_backend
# 典型流程：GitHub Actions / 手动 git pull 拉最新代码与 src/sysconfig → 再在项目根目录执行 docker compose up -d
# 配置目录挂载：./src/apps/{app}/sysconfig → 容器内 /app/config（与 SYSCONFIG_ROOT 一致）
#
# 应用镜像由本地部署脚本构建并传入；两个 Node 服务复用同一镜像。
# mongo / redis / nginx 使用 pull_policy: if_not_present，本地已有镜像时 compose pull / up 不会反复从仓库拉取。

services:
  mongo:
    image: mongo:7
    pull_policy: if_not_present
    container_name: miniapp-mongo
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db
    # 不固定 ipv4：与 backend 的 extra_hosts 绑定时，在部分 ECS/bridge 环境下会出现「解析到固定 IP 但 TCP 不通」；
    # 使用默认分配 + Docker DNS（服务名 mongo）即可稳定互访。
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "mongodb://root:password@127.0.0.1:27017/admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    pull_policy: if_not_present
    container_name: miniapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  begreat_app:
    # 生产环境由 scripts/deploy_amd64_image.sh 在本地构建并传入镜像标签。
    # 未设置时保留默认标签，便于本地已有镜像的场景。
    image: ${ART_BACKEND_IMAGE:-art-backend:latest}
    container_name: miniapp-begreat
    restart: unless-stopped
    command: ["node", "dist/apps/begreat/front.js"]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SYSCONFIG_ROOT: /app/config
      ENV: production
      environment: production
      SERVER_ID: begreat_1
      id: begreat_1
      HTTP_PORT: 41001
      httpPort: 41001
      MINIAPP_PORT: 41002
      miniappApiPort: 41002
      MONGO_URI: mongodb://root:password@mongo:27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BEGREAT_ADMIN_JWT_SECRET: ${BEGREAT_ADMIN_JWT_SECRET}
      COMPOSE_PROJECT_DIR: /workspace
    ports:
      - "41001:41001"
      - "41002:41002"
    volumes:
      - ./src/apps/begreat/sysconfig:/app/config:ro
      - ./static:/app/static
      - ./logs/begreat:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/workspace/miniapp_pro_backend:/workspace:ro

  mandis_app:
    image: ${ART_BACKEND_IMAGE:-art-backend:latest}
    container_name: miniapp-mandis
    restart: unless-stopped
    command: ["node", "dist/apps/mandis/front.js"]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SYSCONFIG_ROOT: /app/config
      ENV: production
      environment: production
      SERVER_ID: front_1
      id: front_1
      GAME_TYPE: front
      gameType: front
      HTTP_PORT: 42001
      httpPort: 42001
      MINIAPP_PORT: 42002
      miniappApiPort: 42002
      WS_PORT: 42000
      port: 42000
      connectionTickTimeout: 30000
      COMPOSE_PROJECT_DIR: /workspace
      MONGO_URI: mongodb://root:password@mongo:27017
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MANDIS_ADMIN_JWT_SECRET: ${MANDIS_ADMIN_JWT_SECRET}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE}
      ALIYUN_DM_ACCESS_KEY_ID: ${ALIYUN_DM_ACCESS_KEY_ID}
      ALIYUN_DM_ACCESS_KEY_SECRET: ${ALIYUN_DM_ACCESS_KEY_SECRET}
      ALIYUN_DM_ACCOUNT_NAME: ${ALIYUN_DM_ACCOUNT_NAME}
      ALIYUN_DM_REGION_ID: ${ALIYUN_DM_REGION_ID:-cn-hangzhou}
      ALIYUN_DM_FROM_ALIAS: ${ALIYUN_DM_FROM_ALIAS:-原色有感}
      ALIYUN_DM_TAG_NAME: ${ALIYUN_DM_TAG_NAME:-original-sense-auth}
      WECHAT_WEB_APP_ID: ${WECHAT_WEB_APP_ID}
      WECHAT_WEB_APP_SECRET: ${WECHAT_WEB_APP_SECRET}
      WECHAT_WEB_REDIRECT_URI: ${WECHAT_WEB_REDIRECT_URI}
      WEB_AUTH_RETURN_URL: ${WEB_AUTH_RETURN_URL}
      WEB_SESSION_TTL_SECONDS: ${WEB_SESSION_TTL_SECONDS:-2592000}
    ports:
      - "42000:42000"
      - "42001:42001"
      - "42002:42002"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/workspace/miniapp_pro_backend:/workspace:ro
      - ./src/apps/mandis/sysconfig:/app/config:ro
      - ./static:/app/static
      - ./logs/mandis:/app/logs

  nginx:
    image: nginx:1.27-alpine
    pull_policy: if_not_present
    container_name: miniapp-nginx
    restart: unless-stopped
    depends_on:
      - begreat_app
      - mandis_app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/logs:/var/log/nginx
      - ./static:/usr/share/nginx/html/static:ro
      # 前端 SPA（art_web build 产物）：先在宿主机 build 后放到 art_web_dist/ 目录
      - ./art_web_dist:/usr/share/nginx/html/app:ro
      # 原色有感独立网页端：本地构建后同步到宿主机独立目录，服务器不执行前端构建
      - /root/workspace/miniapp_pro_web_dist:/usr/share/nginx/html/arttherapy:ro
      # Commander 管理后台（commander build 产物）
      - ../commander/dist:/usr/share/nginx/html/commander:ro
      # Distilled H5（distilled build 产物）
      - /root/workspace/distilled/dist:/usr/share/nginx/html/distill:ro

networks:
  default:
    name: miniapp-backend-net
    ipam:
      config:
        # 勿与宿主机上其他 Docker 网络复用同一 subnet。多项目/遗留网络若都占 172.28.0.0/16，
        # 会出现两条同前缀路由指向不同 br-*，`ip route get` 命中错误网桥 → 容器互连 TCP 超时/拒连。
        # 部署前在宿主机执行：./scripts/check_docker_bridge_subnet_conflict.sh
        - subnet: ${DOCKER_SUBNET:-172.29.0.0/16}
